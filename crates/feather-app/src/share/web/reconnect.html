<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#181614">
<title>Feather</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<script src="/reconnect.js" defer></script>
</head>
<body class="login reconnect">
<main class="card">
  <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>Feather</span></div>
  <h1 id="title">Looking for Feather…</h1>
  <p class="hint" id="message">Checking the addresses this app has used before.</p>
  <div class="choices" id="choices"></div>
  <div class="reconnect-actions">
    <button type="button" id="retry">Try again</button>
    <button type="button" id="scan" hidden>Scan the QR code</button>
  </div>
  <div class="scanner" id="scanner" hidden>
    <video id="camera" playsinline muted></video>
    <p class="hint">Point the camera at the QR code in Feather’s Settings, under Sharing.</p>
    <button type="button" class="quiet" id="stop-scan">Stop</button>
  </div>
  <form id="manual" class="manual">
    <label for="address">Or type or paste the address shown in Feather</label>
    <input id="address" type="url" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://…" required>
    <button type="submit">Open</button>
  </form>
</main>
</body>
</html>
