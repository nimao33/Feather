name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Release build
        run: cargo build --release --workspace

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      # Only the static build needs musl; the package mirrors sometimes
      # fail to resolve, so retry a few times.
      - name: Musl tools
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y musl-tools && exit 0
            echo "apt failed (attempt $attempt), retrying in 20s"; sleep 20
          done
          exit 1
      # One static binary that runs on any distribution.
      - name: Static release build
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: feather-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/feather
